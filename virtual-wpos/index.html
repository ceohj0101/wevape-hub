<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#17181c">
<meta name="description" content="가상 W포스는 Q-POS로 옮겼습니다.">
<title>가상 W포스 — Q-POS로 옮겼습니다</title>
<!-- 2026-11-25 가상 W포스 내림(보드 #772). 원래 화면 코드는 보관 가지 archive/virtual-wpos-20261125 에 보관 — 되살리려면 그 가지의 virtual-wpos/ 를 다시 넣으면 된다. -->
<style>
:root{
  --bg:#f2f2f7; --card:#fff; --fg:#1d1d1f; --muted:#6e6e73; --line:rgba(0,0,0,.08);
  --btn:#17181c; --btn-fg:#fff;
  --ui:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111114; --card:#1c1c20; --fg:#f2f2f7; --muted:#a3a3ab; --line:rgba(255,255,255,.1);
  --btn:#f2f2f7; --btn-fg:#17181c; color-scheme:dark }}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);
  display:flex;align-items:center;justify-content:center;padding:24px;
  -webkit-font-smoothing:antialiased;word-break:keep-all}
.card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);
  border-radius:22px;padding:40px 32px 32px;text-align:center;
  box-shadow:0 18px 50px rgba(20,20,30,.10)}
.icon{width:72px;height:72px;border-radius:18px;display:block;margin:0 auto 22px}
.tag{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px}
h1{font-size:26px;line-height:1.3;font-weight:800;margin:0 0 12px;letter-spacing:-.01em}
p{font-size:15px;line-height:1.6;color:var(--muted);margin:0 0 28px}
a.go{display:block;background:var(--btn);color:var(--btn-fg);text-decoration:none;
  font-size:17px;font-weight:700;padding:15px 0;border-radius:14px}
a.go:focus-visible{outline:3px solid #0a84ff;outline-offset:3px}
.foot{font-size:12px;color:var(--muted);margin:18px 0 0}
</style>
</head>
<body>
<main class="card">
  <img class="icon" src="https://wevape-pos-app.vercel.app/apple-touch-icon.png" alt="" onerror="this.remove()">
  <div class="tag">가상 W포스</div>
  <h1>Q-POS로 옮겼습니다</h1>
  <p>11월 25일부터 전 매장 Q-POS에<br>새 화면이 들어갔습니다.</p>
  <a class="go" href="https://wevape-pos-app.vercel.app/">Q-POS 열기</a>
  <div class="foot">이 시험판은 더 이상 쓰지 않습니다</div>
</main>
</body>
</html>
