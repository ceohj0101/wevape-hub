name: 허브 새업무 검토 자동 처리

# 깃허브 서버가 스스로 돌린다 — 대표 컴퓨터/브라우저가 꺼져 있어도 실행된다.
# 3시간마다 + 수동 실행. 검토 데이터와 사진을 읽고 Claude API로 판정해 data.json에 직접 커밋한다.

on:
  schedule:
    - cron: "0 */3 * * *"   # 3시간마다 (UTC)
  workflow_dispatch: {}       # 깃허브 화면에서 손으로도 돌릴 수 있게

# data.json / photos.json 커밋 권한
permissions:
  contents: write

concurrency:
  group: hub-auto-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 라이브러리 설치
        run: pip install anthropic==0.39.0

      - name: 검토 자동 처리 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/hub_auto_review.py

      - name: 변경분 커밋
        run: |
          if [[ -n "$(git status --porcelain data.json)" ]]; then
            git config user.name "hub-auto-review-bot"
            git config user.email "hub-auto-review-bot@users.noreply.github.com"
            git add data.json
            git commit -m "auto-review: supervisor feedback by scheduled bot"
            git push
          else
            echo "변경 없음 — 커밋 생략"
          fi
