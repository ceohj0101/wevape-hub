<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>1박2일 커플캠핑 메뉴 투표</title>
<script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
<style>
:root{--bg:#f5f2ec;--card:#fff;--text:#202326;--sub:#747980;--line:#e6e0d7;--green:#2f6f4e;--green2:#e8f3ec;--red:#a94343;--red2:#fff0f0;--yellow:#fff5d9;--gray:#eef0f3}*{box-sizing:border-box}html,body{margin:0;width:100%;overflow-x:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:760px;margin:auto;padding:10px 10px 56px}.hero{background:linear-gradient(135deg,#244f3b,#3e7b59);color:#fff;border-radius:18px;padding:20px 16px;margin-bottom:10px}.hero h1{font-size:22px;line-height:1.35;margin:0 0 7px}.hero p{font-size:13px;line-height:1.5;margin:3px 0;opacity:.94}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 4px 14px rgba(0,0,0,.035)}h2{font-size:17px;margin:0 0 5px}.sub{font-size:12px;color:var(--sub);line-height:1.5;margin-bottom:10px}.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.person{border:1px solid #d8d2ca;background:#fff;border-radius:12px;padding:13px 8px;font-weight:800;font-size:15px}.person.active{background:var(--green2);border:2px solid var(--green);color:var(--green)}.progress{font-size:13px;font-weight:800;color:var(--green);margin-top:10px}.status{font-size:13px;font-weight:800;padding:10px 12px;border-radius:11px;background:#eef5f0;color:var(--green);margin-bottom:10px}.status.warn{background:#fff7df;color:#8a651c}.menu{border-top:1px solid var(--line);padding:12px 0}.menu:first-of-type{border-top:0}.menu-name{font-weight:800;font-size:15px;margin-bottom:8px}.choices{display:grid;grid-template-columns:1fr;gap:7px}.choice{border:1px solid #ddd7cf;background:#fff;border-radius:11px;padding:11px;text-align:center;font-size:14px;font-weight:800}.choice.active-love{background:#fdecec;border-color:#eea0a0}.choice.active-ok{background:var(--yellow);border-color:#e0ba63}.choice.active-no{background:var(--gray);border-color:#abb2bc}.feedback{display:none;margin-top:8px;padding:10px;background:var(--red2);border:1px solid #efcccc;border-radius:11px}.feedback.show{display:block}.feedback label{display:block;font-size:12px;font-weight:800;color:#963d3d;margin-bottom:6px}input{width:100%;max-width:100%;border:1px solid #d8d2ca;border-radius:11px;padding:12px;font-size:16px;font-family:inherit;background:#fff}.extra{margin-top:12px}.actions{display:grid;grid-template-columns:1fr;gap:8px}.btn{width:100%;border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:900;cursor:pointer}.primary{background:var(--green);color:#fff}.secondary{background:#ece8e2;color:#333}.hidden{display:none!important}.result-section{margin-top:14px}.result-menu{border-top:1px solid var(--line);padding:12px 0}.result-menu:first-child{border-top:0}.score{display:flex;gap:7px;flex-wrap:wrap;margin:7px 0}.badge{font-size:12px;font-weight:800;border-radius:999px;padding:5px 8px;background:#f3f3f3}.badge.love{background:#fdecec}.badge.ok{background:#fff5da}.badge.no{background:#eef0f3}.reject-note{font-size:13px;line-height:1.5;margin-top:6px;padding:8px 10px;background:#fff2f2;border-radius:9px}.reject-note b{color:#a64040}.extra-result{font-size:13px;line-height:1.55;padding:8px 0;color:#444}.save-pop{display:none;position:fixed;left:12px;right:12px;bottom:18px;z-index:20;max-width:720px;margin:auto;background:#1f5e40;color:#fff;border-radius:14px;padding:14px 16px;font-size:14px;font-weight:900;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.2)}.save-pop.show{display:block}@media(min-width:641px){.wrap{padding:20px 16px 60px}.choices{grid-template-columns:repeat(3,minmax(0,1fr))}.actions.two{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><h1>🏕 1박2일 커플캠핑 메뉴 투표</h1><p>김형진 · 정경빈 · 장민영 · 동훈</p><p>❤️ 꼭 먹음 · ○ 괜찮음 · ❌ 빼도 됨</p></div>
  <div class="status" id="syncStatus">공동 투표 연결 중…</div>
  <div class="card"><h2>1. 내 이름 선택</h2><div class="sub">본인 이름을 누른 뒤 투표해주세요. 기존 투표가 있으면 자동으로 불러옵니다.</div><div class="people" id="people"></div><div class="progress" id="progress"></div></div>
  <div id="voteArea" class="hidden"><div id="sections"></div>
    <div class="card"><h2>최종 한 줄 의견</h2><div class="sub">전체 메뉴 기준 하나씩만 적어주세요.</div><div class="menu-name">🔥 무조건 살릴 메뉴</div><input id="mustKeep" placeholder="예: 양고기"><div class="menu-name" style="margin-top:12px">🗑 무조건 뺄 메뉴</div><input id="mustDrop" placeholder="예: 순대"></div>
    <div class="actions two"><button id="submitBtn" class="btn primary" onclick="submitVote()">투표 제출</button><button class="btn secondary" onclick="showResults()">전체 결과 보기</button></div>
  </div>
  <div class="card" id="resultsCard" style="margin-top:10px"><h2>📊 전체 투표 결과</h2><div class="sub">메뉴별 표 수와 ❌를 누른 사람의 이유가 표시됩니다.</div><div id="results"></div></div>
</div>
<div id="savePop" class="save-pop">✓ 투표가 저장됐습니다.</div>
<script>
const NAMES=['김형진','정경빈','장민영','동훈'];
const SECTIONS=[
 {title:'① 캠핑장 도착 후 가볍게',note:'최대 2개 정도 추천',items:['회 또는 시장 안주','순대','육회']},
 {title:'② 물놀이 후 점심',note:'1개 선택 추천',items:['삼계탕','들기름막국수']},
 {title:'③ 메인 저녁',note:'고기 2종까지 추천',items:['양고기','돼지고기','소고기']},
 {title:'④ 저녁 2차',note:'1개 선택 추천',items:['부대찌개','불닭볶음탕면']},
 {title:'⑤ 야식',note:'최대 2개 정도 추천',items:['쭈꾸미볶음','버터 갑오징어구이','명란구이','오뎅/물떡']}
];
const PEERS=['https://gunjs.herokuapp.com/gun','https://gun-manhattan.herokuapp.com/gun','https://try.axe.eco/gun','https://test.era.eco/gun'];
const gun=Gun({peers:PEERS,localStorage:true,retry:1500});
const room=gun.get('jecheon-couple-camping-20260814-fixed-v1');
let votes=[null,null,null,null],currentSlot=null,lastRemote=0;
function key(i){return 'campVoteFixed_'+i}
function parse(v){try{return JSON.parse(v)}catch(e){return null}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function localLoad(){for(let i=0;i<4;i++){const v=parse(localStorage.getItem(key(i)));if(v)votes[i]=v}}
function localSave(i,v){try{localStorage.setItem(key(i),JSON.stringify(v))}catch(e){}}
function setStatus(t,warn=false){const e=document.getElementById('syncStatus');e.textContent=t;e.className='status'+(warn?' warn':'')}
localLoad();
for(let i=0;i<4;i++){
  room.get('vote'+i).on(raw=>{
    const v=parse(raw);if(!v)return;
    if(!votes[i] || (v.updatedAt||0)>=(votes[i].updatedAt||0)){votes[i]=v;localSave(i,v)}
    lastRemote=Date.now();renderPeople();renderResults();
    if(currentSlot===i && document.activeElement?.tagName!=='INPUT')loadSlot(i,false);
    setStatus('✓ 공동 투표 연결됨 · 다른 사람 투표도 자동 반영됩니다.');
  });
}
function renderPeople(){const box=document.getElementById('people');box.innerHTML='';NAMES.forEach((n,i)=>{const b=document.createElement('button');b.className='person'+(i===currentSlot?' active':'');b.textContent=(votes[i]?'✓ ':'')+n;b.onclick=()=>loadSlot(i,true);box.appendChild(b)});document.getElementById('progress').textContent=`현재 ${votes.filter(Boolean).length}/4명 투표 완료`}
function buildSections(){const h=document.getElementById('sections');h.innerHTML='';SECTIONS.forEach((sec,s)=>{const c=document.createElement('div');c.className='card';c.innerHTML=`<h2>${sec.title}</h2><div class="sub">${sec.note}</div>`;sec.items.forEach((item,i)=>{const k=`${s}-${i}`,m=document.createElement('div');m.className='menu';m.innerHTML=`<div class="menu-name">${item}</div><div class="choices" data-key="${k}"><button class="choice" data-choice="love" onclick="pick('${k}','love')">❤️ 꼭 먹음</button><button class="choice" data-choice="ok" onclick="pick('${k}','ok')">○ 괜찮음</button><button class="choice" data-choice="no" onclick="pick('${k}','no')">❌ 빼도 됨</button></div><div class="feedback" id="fw-${k}"><label>💬 왜 빼고 싶은지 한마디</label><input id="fb-${k}" placeholder="예: 회를 별로 안 좋아함"></div>`;c.appendChild(m)});const e=document.createElement('div');e.className='extra';e.innerHTML=`<div class="menu-name">➕ 이 시간대 추가 메뉴</div><input id="extra-${s}" placeholder="예: 닭꼬치, 볶음밥">`;c.appendChild(e);h.appendChild(c)})}
function setChoice(k,ch){const box=document.querySelector(`.choices[data-key="${k}"]`);if(!box)return;box.dataset.selected=ch;box.querySelectorAll('.choice').forEach(b=>{b.classList.remove('active-love','active-ok','active-no');if(b.dataset.choice===ch)b.classList.add('active-'+ch)});const fw=document.getElementById('fw-'+k);if(ch==='no')fw.classList.add('show');else{fw.classList.remove('show');const f=document.getElementById('fb-'+k);if(f)f.value=''}}
function pick(k,ch){setChoice(k,ch);if(ch==='no')setTimeout(()=>document.getElementById('fb-'+k)?.focus(),60)}
function loadSlot(i,scroll){currentSlot=i;buildSections();document.getElementById('voteArea').classList.remove('hidden');const v=votes[i]||{};Object.entries(v.choices||{}).forEach(([k,x])=>{setChoice(k,x.choice);if(x.choice==='no'){const el=document.getElementById('fb-'+k);if(el)el.value=x.feedback||''}});SECTIONS.forEach((_,s)=>document.getElementById('extra-'+s).value=(v.extras||{})[s]||'');document.getElementById('mustKeep').value=v.mustKeep||'';document.getElementById('mustDrop').value=v.mustDrop||'';renderPeople();if(scroll)document.getElementById('voteArea').scrollIntoView({behavior:'smooth',block:'start'})}
function collect(){const choices={};document.querySelectorAll('.choices').forEach(box=>{const k=box.dataset.key,ch=box.dataset.selected;if(ch)choices[k]={choice:ch,feedback:ch==='no'?(document.getElementById('fb-'+k)?.value.trim()||''):''}});const extras={};SECTIONS.forEach((_,s)=>extras[s]=document.getElementById('extra-'+s).value.trim());return{choices,extras,mustKeep:document.getElementById('mustKeep').value.trim(),mustDrop:document.getElementById('mustDrop').value.trim(),updatedAt:Date.now()}}
function submitVote(){if(currentSlot===null){alert('먼저 본인 이름을 선택해주세요.');return}const data=collect();votes[currentSlot]=data;localSave(currentSlot,data);renderPeople();renderResults();const btn=document.getElementById('submitBtn');btn.textContent='✓ 제출 완료';const pop=document.getElementById('savePop');pop.textContent=`✓ ${NAMES[currentSlot]} 투표가 저장됐습니다.`;pop.classList.add('show');setTimeout(()=>pop.classList.remove('show'),2200);setTimeout(()=>btn.textContent='투표 수정 / 다시 제출',900);setStatus('✓ 내 휴대폰에 저장 완료 · 공동 서버로 동기화 중…');try{room.get('vote'+currentSlot).put(JSON.stringify(data));setTimeout(()=>{if(Date.now()-lastRemote>7000)setStatus('✓ 내 투표는 저장됨 · 공동 동기화 연결을 재시도 중…',true)},7500)}catch(e){setStatus('✓ 내 투표는 저장됐습니다. 공동 동기화는 자동 재시도합니다.',true)}}
function renderResults(){const out=document.getElementById('results');out.innerHTML='';SECTIONS.forEach((sec,s)=>{const wrap=document.createElement('div');wrap.className='result-section';wrap.innerHTML=`<h2>${sec.title}</h2>`;sec.items.forEach((item,i)=>{const k=`${s}-${i}`,cnt={love:0,ok:0,no:0},rej=[];votes.forEach((v,slot)=>{const x=v?.choices?.[k];if(x){cnt[x.choice]=(cnt[x.choice]||0)+1;if(x.choice==='no')rej.push({name:NAMES[slot],feedback:x.feedback||''})}});const d=document.createElement('div');d.className='result-menu';d.innerHTML=`<div class="menu-name">${item}</div><div class="score"><span class="badge love">❤️ ${cnt.love}표</span><span class="badge ok">○ ${cnt.ok}표</span><span class="badge no">❌ ${cnt.no}표</span></div>${rej.map(r=>`<div class="reject-note"><b>❌ ${esc(r.name)}</b> — ${r.feedback?esc(r.feedback):'별도 의견 없음'}</div>`).join('')}`;wrap.appendChild(d)});const ex=[];votes.forEach((v,slot)=>{const t=v?.extras?.[s];if(t)ex.push(`<b>${esc(NAMES[slot])}</b>: ${esc(t)}`)});if(ex.length){const e=document.createElement('div');e.className='extra-result';e.innerHTML=`<b>➕ 추가 메뉴 의견</b><br>${ex.join('<br>')}`;wrap.appendChild(e)}out.appendChild(wrap)});const f=document.createElement('div');f.className='result-section';const keep=[],drop=[];votes.forEach((v,i)=>{if(v?.mustKeep)keep.push(`<b>${esc(NAMES[i])}</b>: ${esc(v.mustKeep)}`);if(v?.mustDrop)drop.push(`<b>${esc(NAMES[i])}</b>: ${esc(v.mustDrop)}`)});f.innerHTML=`<h2>최종 한 줄 의견</h2><div class="extra-result"><b>🔥 무조건 살릴 메뉴</b><br>${keep.length?keep.join('<br>'):'아직 의견 없음'}</div><div class="extra-result"><b>🗑 무조건 뺄 메뉴</b><br>${drop.length?drop.join('<br>'):'아직 의견 없음'}</div>`;out.appendChild(f)}
function showResults(){document.getElementById('resultsCard').scrollIntoView({behavior:'smooth',block:'start'})}
renderPeople();renderResults();setTimeout(()=>{if(!lastRemote)setStatus('공동 서버 연결을 재시도 중입니다. 투표 제출 자체는 가능합니다.',true)},6000);
</script>
</body>
</html>
